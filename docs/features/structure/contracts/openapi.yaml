# Derived — never hand-edit without re-running /sdd:api structure --reconcile after upstream changes.
#   fields + constraints  ← data-model.md (structure, structure_layout_position, structure_connection)
#   error responses       ← sad.md §6 sequence alt-branches
#   endpoint list + shape ← spec.md §4 user stories / §5 acceptance criteria
# prose-only touch-up 2026-09-11 for D-113, re-run --reconcile for a full regenerate later
#
# D-131-наступне рішення (Андрій, чат, 2026-09-15) -- ще одна hand-edit, поза
# нормальним /sdd:api-проходом (great task instructions explicitly accept
# this for an internal-narrow change): cellIndex/AC-02 прибрані повністю,
# LayoutPosition тепер несе {x, y} (відсоток канви 0-100) замість номера
# клітинки, і додано новий тег Connections (structure_connection) --
# інструмент "Зв'язати" на Схемі. Чесний коментар, а не мовчазний дрейф:
# наступний /sdd:api --reconcile має звірити ЦЕЙ файл з оновленим
# data-model.md, а не навпаки.
openapi: 3.1.0

info:
  title: Structure API
  version: 0.1.0
  description: |
    Один об'єкт на користувача — Структура — тримає декларацію "картина світу, навіщо, пріоритет"
    окремо від Опису кожної картки, розкладку карток за одним із трьох варіантів групування,
    і зведену аналітику (середній прогрес + чесний розрив між заявленим і фактичним, без вердикту).
    Прогрес кожної картки отримується через уже наявну доменну логіку `life-area-card`
    (ADR-0001) — цей API не рахує власну формулу прогресу, лише зводить отримані значення.

    Структура — singleton: жодна операція не приймає її ідентифікатор. Кожен ендпоінт діє на
    "мою власну Структуру", визначену через Bearer-токен — цим структурно закривається AC-03
    (доступ до чужої Структури неможливо навіть спробувати, бо адресувати чужу Структуру нема як).
  contact:
    name: Андрій Данилюк

servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost
    description: Local

security:
  - BearerAuth: []

tags:
  - name: Structure
    description: Singleton-декларація та спосіб розкладки
  - name: Layout
    description: Позиції карток на вільному полотні розкладки
  - name: Connections
    description: Лінії/стрілки між картками на Схемі (інструмент "Зв'язати")

paths:
  /api/v1/structure:
    get:
      tags: [Structure]
      summary: Прочитати мою Структуру (декларація + спосіб розкладки)
      description: |
        Повертає Структуру поточного користувача. Якщо Структура ще не існувала (перший вхід) —
        створюється лениво (lazy) з порожньою декларацією й `layout_mode: null` (AC-09 — вибір
        способу розкладки не обов'язковий одразу).
      operationId: getMyStructure
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Structure" }
        "401":
          $ref: "#/components/responses/Error"

    patch:
      tags: [Structure]
      summary: Оновити декларацію та/або спосіб розкладки
      description: |
        Частковий запис — можна передати `declaration`, `layoutMode`, чи обидва (AC-10, AC-11).

        **Вимоги 14/15 (Андрій, чат) — плоска модель.** Раніше `layoutMode` (3 значення) і
        `logicVariant` (3 значення, мав сенс лише при `layoutMode = 'logic'`) були ДВОМА окремими
        полями. Тепер — ОДНЕ поле `layoutMode`, 5 рівноправних значень: `balance`/`focus`/
        `cause_effect` (колишні підвиди "за логікою", тепер топ-рівневі), `free` (вільна розкладка),
        `staging` (готово до розкладання — новий). `single` ("одна картка") скасований повністю.
        `logicVariant` більше не існує ні як поле запиту, ні як поле відповіді.

        Конфлікт офлайн-синхронізації (два пристрої редагували одночасно) вирішується
        last-write-wins за `updatedAt` клієнта проти збереженого значення (ADR-0002) — сервер
        мовчки приймає останній за часом запис, явного прапорця конфлікту немає.

        **Побічна дія (AC-11b, D-131-наступне рішення):** якщо `layoutMode` змінюється на
        ЗНАЧЕННЯ, ВІДМІННЕ від збереженого, сервер автоматично рахує й записує АВТО-РОЗКЛАД
        нового режиму — реальні координати `x`/`y` для кожної картки власника (і вже розкладеної,
        і з купки нерозкладених), а для `balance`/`focus`/`cause_effect` ще й зв'язки між ними
        (`POST/GET /structure/connections` нижче). Це НЕ скидання в трей — кожен режим сам
        визначає, де саме опиняється кожна картка (docs/features/structure/data-model.md формули).
        Виняток — `staging`: жодного запису, картки лишаються де є. Клієнт після відповіді читає
        `GET /structure/layout` (+ `GET /structure/connections`), щоб показати новий розклад.
        Запис, що не змінює `layoutMode`, авто-розкладу не запускає.
      operationId: updateMyStructure
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StructureUpdate" }
            example:
              declaration: "Навчання й здоров'я зараз важливіші за кар'єру."
              layoutMode: "focus"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Structure" }
        "401":
          $ref: "#/components/responses/Error"
        "422":
          description: |
            - `structure.invalid_layout_mode` — `layoutMode` не одне з `balance`/`focus`/
              `cause_effect`/`free`/`staging`/`null`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "structure.invalid_layout_mode"
                message: "layoutMode must be one of: balance, focus, cause_effect, free, staging"

  /api/v1/structure/layout:
    get:
      tags: [Layout]
      summary: Прочитати активні позиції розкладки (екран Схема)
      description: "Список позицій (`cardId` + `x`/`y`, відсоток канви 0-100) для екрана Схема — лише активні (`status: active`). `x`/`y` обидва `null` — картка в купці нерозкладених знизу екрана."
      operationId: listLayoutPositions
      parameters:
        - in: query
          name: after
          description: cursor — id останньої побаченої позиції
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayoutPositionPage" }
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/structure/layout/history:
    get:
      tags: [Layout]
      summary: Реконструювати розкладку на попередню дату (для тренду розриву, AC-07)
      description: |
        Читає останню позицію кожної картки з `structure_history_event` — тієї самої бази
        мінімального бекенда, що й `structure`/`structure_layout_position` (D-113) — з
        `occurred_at <= asOf`, тобто "якою була розкладка на цю дату". Використовується Потоком 9
        (`sad.md §6`), щоб порахувати, чи розрив зростає, чи меншає з часом.
      operationId: getLayoutHistoryAsOf
      parameters:
        - in: query
          name: asOf
          required: true
          description: контрольна точка часу (ISO 8601)
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayoutPositionPage" }
        "401":
          $ref: "#/components/responses/Error"
        "422":
          description: asOf у майбутньому чи невалідний формат
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "structure.invalid_as_of"
                message: "asOf must be a past ISO 8601 timestamp"

  /api/v1/structure/layout/{cardId}:
    put:
      tags: [Layout]
      summary: Перемістити картку на нову позицію (перетягування мишею чи дотиком, AC-08)
      description: |
        Ставить картку `cardId` на позицію `x`/`y` (відсоток канви 0-100) у Структурі поточного
        користувача. D-131-наступне рішення: жодної колізії немає — вільне позиціювання дозволяє
        карткам перекриватись (AC-02 прибрана повністю разом із фіксованою сіткою). `x`/`y`
        клемпляться в межі 0..100 на сервері. Конфлікт офлайн-синхронізації — last-write-wins за
        `positionUpdatedAt` (ADR-0002, Потік 2).
      operationId: moveCard
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LayoutPositionMoveRequest" }
            example:
              x: 62.5
              y: 40
              positionUpdatedAt: "2026-08-24T10:15:00Z"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayoutPosition" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: |
            картка не знайдена в розкладці поточного користувача — той самий код і для "не існує",
            і для "належить іншому користувачу" (AC-03: не підтверджуємо й не спростовуємо)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "structure.card_not_found"
                message: "Card not found in your Structure"

    post:
      tags: [Layout]
      summary: Закрити напрямок (AC-12)
      description: |
        Закриває позицію картки `cardId` в розкладці (м'який статус `closed`, ніколи фізичне
        видалення — D-66) і пише подію `closed` у `structure_history_event` з часовою міткою (AC-15).
        Опційно переносить перелічені метрики картки в інші існуючі картки перед закриттям
        (AC-12, D-65) — сам перенос виконує доменна логіка `life-area-card`
        (`life-area-card` API US-13/AC-14/AC-15, поза цим контрактом).
      operationId: closeCard
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloseCardRequest" }
            example:
              metricTransfers:
                - metricBlockId: "8f14e45f-ceea-4d6a-9c3a-77b3f2a55e11"
                  targetCardId: "2f9d3e4a-1b2c-4d5e-8f6a-9b0c1d2e3f4a"
                  newLabel: "км (перенесено)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayoutPosition" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: cardId не знайдений у Структурі поточного користувача (AC-03, як вище)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "structure.card_not_found"
                message: "Card not found in your Structure"
        "422":
          description: цільова картка перенесення метрики не знайдена чи не належить користувачу
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "structure.metric_transfer_target_invalid"
                message: "targetCardId does not exist or is not yours"
        "409":
          description: |
            колізія назви+одиниці метрики на цільовій картці перенесення (`newLabel` не задано) —
            той самий код, що `life-area-card`'s `POST /cards/{cardId}/metric-blocks/transfer`
            (внутрішній виклик того ж use-case, не окрема операція цього контракту; review 2026-09-11).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "metric_block.name_collision"
                message: "У картці-призначенні вже є блок із такою назвою й одиницею"

  /api/v1/structure/connections:
    get:
      tags: [Connections]
      summary: Прочитати всі зв'язки Структури (екран Схема)
      description: |
        Список ліній/стрілок між картками поточного власника — той самий owner-scoped доступ, що
        `/structure/layout` (AC-03). Без пагінації: зв'язків на одну Структуру завжди мало (той
        самий MVP-обсяг, що sad.md §11 уже приймає для позицій).
      operationId: listConnections
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Connection" }
        "401":
          $ref: "#/components/responses/Error"

    post:
      tags: [Connections]
      summary: Створити зв'язок між двома картками (інструмент "Зв'язати", вимоги 4/5)
      description: |
        Створює лінію (`directed: false`) чи стрілку (`directed: true`, `cardIdA -> cardIdB`) між
        двома картками поточного власника. Обидві картки мусять мати активну позицію в Структурі
        власника — інакше `structure.card_not_found` (AC-03 non-disclosure, той самий код, що
        `moveCard`/`closeCard`).
      operationId: createConnection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectionCreateRequest" }
            example:
              cardIdA: "8f14e45f-ceea-4d6a-9c3a-77b3f2a55e11"
              cardIdB: "2f9d3e4a-1b2c-4d5e-8f6a-9b0c1d2e3f4a"
              directed: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: одна з карток не знайдена в розкладці поточного користувача (AC-03)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "structure.card_not_found"
                message: "Card not found in your Structure"
        "422":
          description: cardIdA і cardIdB — та сама картка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "structure.connection_requires_two_cards"
                message: "Не можна з'єднати картку саму із собою"

  /api/v1/structure/connections/{connectionId}:
    delete:
      tags: [Connections]
      summary: Розірвати зв'язок (тап по наявній лінії/стрілці, вимога 4)
      description: |
        Видаляє зв'язок фізично (на відміну від `structure_layout_position`, зв'язок не має
        історії/переносу метрик, що варто було б зберегти — легша дія, ніж архівація картки).
        Owner-scoped non-disclosure (AC-03): чужий/неіснуючий зв'язок — той самий 404.
      operationId: deleteConnection
      parameters:
        - in: path
          name: connectionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: зв'язок не знайдено в Структурі поточного користувача
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "structure.connection_not_found"
                message: "Connection not found in your Structure"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error — unified envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: "^[a-z_]+\\.[a-z_]+$"
          example: "structure.card_not_found"
        message: { type: string }
        details:
          type: object
          description: опційний структурований контекст (напр. конфліктуючий cellIndex)

    Structure:
      type: object
      required: [id, layoutMode, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        declaration:
          type: [string, "null"]
          description: картина світу / навіщо / пріоритет — окремо від Опису картки (AC-10)
        layoutMode:
          type: [string, "null"]
          enum: [balance, focus, cause_effect, free, staging, null]
          description: |
            "null = ще не обрано (AC-09). Плоска модель, 5 рівноправних значень (вимоги 14/15,
            D-29/D-83): balance = баланс навколо ядра, focus = фокус і спостереження,
            cause_effect = причина і наслідок (колишні підвиди "за логікою", тепер топ-рівневі),
            free = вільна розкладка, staging = готово до розкладання (нова картка не отримує
            клітинку автоматично, AC-18). Колишнє 'single' ("одна картка") скасоване повністю.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StructureUpdate:
      type: object
      additionalProperties: false
      properties:
        declaration: { type: [string, "null"] }
        layoutMode: { type: [string, "null"], enum: [balance, focus, cause_effect, free, staging, null] }

    LayoutPosition:
      type: object
      required: [cardId, x, y, status, positionUpdatedAt]
      additionalProperties: false
      properties:
        cardId: { type: string, format: uuid }
        x:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          description: |
            Відсоток ширини канви (0-100), D-131-наступне рішення (вільне полотно замість
            фіксованої сітки клітинок). `x`/`y` завжди приходять разом: `null` — картка ще нікуди
            не розкладена ("купка нерозкладених знизу екрана" — AC-11b/AC-17). `minimum`/`maximum`
            стосуються лише не-null значення.
        y:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          description: Відсоток висоти канви (0-100) — той самий принцип null, що `x`.
        status:
          type: string
          enum: [active, closed]
          description: "'closed' — м'яке закриття напрямку (AC-12, D-66), ніколи фізичне видалення"
        positionUpdatedAt:
          type: string
          format: date-time
          description: часова мітка для last-write-wins при офлайн-конфлікті (ADR-0002)

    LayoutPositionMoveRequest:
      type: object
      required: [x, y, positionUpdatedAt]
      additionalProperties: false
      properties:
        x: { type: number, minimum: 0, maximum: 100 }
        y: { type: number, minimum: 0, maximum: 100 }
        positionUpdatedAt:
          type: string
          format: date-time
          description: часова мітка клієнта — визначає переможця при конфлікті (ADR-0002)

    Connection:
      type: object
      required: [id, cardIdA, cardIdB, directed, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        cardIdA: { type: string, format: uuid }
        cardIdB: { type: string, format: uuid }
        directed:
          type: boolean
          description: "true — стрілка cardIdA -> cardIdB; false — звичайна лінія (порядок a/b не несе сенсу)"
        createdAt: { type: string, format: date-time }

    ConnectionCreateRequest:
      type: object
      required: [cardIdA, cardIdB, directed]
      additionalProperties: false
      properties:
        cardIdA: { type: string, format: uuid }
        cardIdB: { type: string, format: uuid }
        directed: { type: boolean }

    CloseCardRequest:
      type: object
      additionalProperties: false
      properties:
        metricTransfers:
          type: array
          items: { $ref: "#/components/schemas/MetricTransfer" }
          default: []
          description: "порожньо/відсутнє = закрити без перенесення жодної метрики (AC-12)"

    MetricTransfer:
      type: object
      required: [metricBlockId, targetCardId]
      additionalProperties: false
      properties:
        metricBlockId: { type: string, format: uuid }
        targetCardId: { type: string, format: uuid }
        newLabel:
          type: [string, "null"]
          description: "перейменування при колізії назви з метрикою, що вже є на цільовій картці (life-area-card AC-15)"

    LayoutPositionPage:
      type: object
      required: [items, has_next, has_prev]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LayoutPosition" }
        has_next: { type: boolean }
        has_prev: { type: boolean }
        next_cursor: { type: [string, "null"], format: uuid }
