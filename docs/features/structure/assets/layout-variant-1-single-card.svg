<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Одна велика картка з деталями показана вгорі окремо у вільному полі. Решта карток — маленькі однакові підписи-плашки внизу, зʼєднані стрілкою з великою карткою">
  <rect x="0" y="0" width="640" height="440" fill="#ffffff"/>

  <rect x="170" y="46" width="300" height="212" rx="8" fill="#2e4f42"/>
  <text x="196" y="82" font-family="system-ui, sans-serif" font-weight="600" font-size="16" fill="#ffffff">Кар'єра</text>
  <line x1="196" y1="100" x2="420" y2="100" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/>
  <line x1="196" y1="118" x2="380" y2="118" stroke="#ffffff" stroke-width="1.4" opacity="0.4"/>
  <line x1="196" y1="136" x2="400" y2="136" stroke="#ffffff" stroke-width="1.4" opacity="0.4"/>
  <rect x="196" y="212" width="248" height="10" rx="5" fill="#ffffff" opacity="0.25"/>
  <rect x="196" y="212" width="158" height="10" rx="5" fill="#ffffff" opacity="0.85"/>
  <text x="196" y="238" font-family="system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#ffffff" opacity="0.85">прогрес 64%</text>

  <defs>
    <marker id="arrow1" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b9285"/>
    </marker>
  </defs>
  <path d="M110,362 C110,300 150,300 178,264" fill="none" stroke="#8b9285" stroke-width="1.3" stroke-dasharray="3 4" marker-end="url(#arrow1)"/>
  <text x="30" y="300" font-family="system-ui, sans-serif" font-size="11" fill="#8b9285">тап →</text>
  <text x="14" y="314" font-family="system-ui, sans-serif" font-size="11" fill="#8b9285">на передній план</text>

  <g font-family="system-ui, sans-serif" font-size="11.5" fill="#1c211d">
    <rect x="70"  y="362" width="100" height="46" rx="4" fill="#ffffff" stroke="#8b9285" stroke-width="1.2"/>
    <text x="120" y="389" text-anchor="middle">Здоровʼя</text>

    <rect x="185" y="362" width="100" height="46" rx="4" fill="#ffffff" stroke="#8b9285" stroke-width="1.2"/>
    <text x="235" y="389" text-anchor="middle">Фінанси</text>

    <rect x="300" y="362" width="100" height="46" rx="4" fill="#ffffff" stroke="#8b9285" stroke-width="1.2"/>
    <text x="350" y="389" text-anchor="middle">Стосунки</text>

    <rect x="415" y="362" width="100" height="46" rx="4" fill="#ffffff" stroke="#8b9285" stroke-width="1.2"/>
    <text x="465" y="389" text-anchor="middle">Навчання</text>

    <rect x="530" y="362" width="100" height="46" rx="4" fill="#ffffff" stroke="#8b9285" stroke-width="1.2"/>
    <text x="580" y="389" text-anchor="middle">Спорт</text>
  </g>
</svg>
