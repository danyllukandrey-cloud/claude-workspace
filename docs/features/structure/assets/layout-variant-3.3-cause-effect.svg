<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-label="Дерево зліва направо. Головна картка зліва розгалужується на дві картки, кожна з яких розгалужується ще на три">
  <rect x="0" y="0" width="760" height="480" fill="#ffffff"/>

  <defs>
    <marker id="arrow3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b9285"/>
    </marker>
  </defs>

  <g stroke="#8b9285" stroke-width="1.3" fill="none" marker-end="url(#arrow3)" opacity="0.8">
    <path d="M150,240 H250 V150 H305"/>
    <path d="M150,240 H250 V340 H305"/>

    <path d="M470,150 H520 V70  H575"/>
    <path d="M470,150 H520 V150 H575"/>
    <path d="M470,150 H520 V230 H575"/>

    <path d="M470,340 H520 V260 H575"/>
    <path d="M470,340 H520 V340 H575"/>
    <path d="M470,340 H520 V420 H575"/>
  </g>

  <rect x="20" y="210" width="130" height="60" rx="4" fill="#2e4f42"/>
  <text x="85" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="13.5" fill="#ffffff">Здоровʼя</text>

  <g fill="#dbe6dd" stroke="#2e4f42" stroke-width="1.4">
    <rect x="305" y="120" width="165" height="56" rx="4"/>
    <rect x="305" y="312" width="165" height="56" rx="4"/>
  </g>
  <text x="387.5" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#1c211d">Ментальне здоровʼя</text>
  <text x="387.5" y="344" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#1c211d">Фізичне здоровʼя</text>

  <g fill="#ffffff" stroke="#8b9285" stroke-width="1.1">
    <rect x="575" y="42"  width="165" height="48" rx="3"/>
    <rect x="575" y="122" width="165" height="48" rx="3"/>
    <rect x="575" y="202" width="165" height="48" rx="3"/>
    <rect x="575" y="232" width="165" height="48" rx="3"/>
    <rect x="575" y="312" width="165" height="48" rx="3"/>
    <rect x="575" y="392" width="165" height="48" rx="3"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#1c211d">
    <text x="657.5" y="70" text-anchor="middle">Відпочинок</text>
    <text x="657.5" y="150" text-anchor="middle">Самореалізація</text>
    <text x="657.5" y="230" text-anchor="middle">Відносини</text>
    <text x="657.5" y="260" text-anchor="middle">Робота</text>
    <text x="657.5" y="340" text-anchor="middle">Стан / показники</text>
    <text x="657.5" y="420" text-anchor="middle">…</text>
  </g>
</svg>
