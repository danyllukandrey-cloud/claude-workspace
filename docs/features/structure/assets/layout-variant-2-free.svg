<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Вісім однакових карток розташовані вроздріб з приблизно рівними відстанями одна від одної, без ліній, без центру, без картки, що виділяється розміром чи кольором">
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>

  <g font-family="system-ui, sans-serif" font-size="12" fill="#1c211d">
    <rect x="45"  y="46"  width="130" height="54" rx="5" fill="#dbe6dd" stroke="#2e4f42" stroke-width="1.4"/>
    <text x="110" y="78" text-anchor="middle">Здоровʼя</text>

    <rect x="265" y="46"  width="130" height="54" rx="5" fill="#dbe6dd" stroke="#2e4f42" stroke-width="1.4"/>
    <text x="330" y="78" text-anchor="middle">Кар'єра</text>

    <rect x="465" y="46"  width="130" height="54" rx="5" fill="#dbe6dd" stroke="#2e4f42" stroke-width="1.4"/>
    <text x="530" y="78" text-anchor="middle">Фінанси</text>

    <rect x="145" y="166" width="130" height="54" rx="5" fill="#dbe6dd" stroke="#2e4f42" stroke-width="1.4"/>
    <text x="210" y="198" text-anchor="middle">Навчання</text>

    <rect x="365" y="166" width="130" height="54" rx="5" fill="#dbe6dd" stroke="#2e4f42" stroke-width="1.4"/>
    <text x="430" y="198" text-anchor="middle">Стосунки</text>

    <rect x="25"  y="286" width="130" height="54" rx="5" fill="#dbe6dd" stroke="#2e4f42" stroke-width="1.4"/>
    <text x="90"  y="318" text-anchor="middle">Спорт</text>

    <rect x="255" y="286" width="130" height="54" rx="5" fill="#dbe6dd" stroke="#2e4f42" stroke-width="1.4"/>
    <text x="320" y="318" text-anchor="middle">Хобі</text>

    <rect x="475" y="286" width="130" height="54" rx="5" fill="#dbe6dd" stroke="#2e4f42" stroke-width="1.4"/>
    <text x="540" y="318" text-anchor="middle">Дім</text>
  </g>
</svg>
