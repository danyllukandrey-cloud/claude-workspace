<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-label="Схема поділена на дві половини. Ліва половина містить картки, які лише вимірюються. Права половина містить картки під активною увагою. У центрі на межі половин — головна картка">
  <rect x="0" y="0" width="320" height="460" fill="#e6e8ed" opacity="0.6"/>
  <rect x="320" y="0" width="320" height="460" fill="#f1e0cd" opacity="0.55"/>
  <line x1="320" y1="16" x2="320" y2="444" stroke="#8b9285" stroke-width="1" stroke-dasharray="3 5" opacity="0.6"/>

  <text x="160" y="34" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="1" fill="#6b7488">ІСНУЄ · ВИМІРЮЄТЬСЯ</text>
  <text x="480" y="34" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="1" fill="#a8622e">АКТИВНИЙ ФОКУС</text>

  <g stroke="#9aa1b0" stroke-width="1.3" stroke-dasharray="2 4" opacity="0.8">
    <line x1="260" y1="90"  x2="270" y2="230"/>
    <line x1="260" y1="230" x2="270" y2="230"/>
    <line x1="260" y1="370" x2="270" y2="230"/>
  </g>
  <g stroke="#a8622e" stroke-width="1.6" opacity="0.9">
    <line x1="370" y1="230" x2="380" y2="90"/>
    <line x1="370" y1="230" x2="380" y2="230"/>
    <line x1="370" y1="230" x2="380" y2="370"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="12" fill="#1c211d">
    <rect x="90" y="66"  width="170" height="48" rx="3" fill="#ffffff" stroke="#9aa1b0" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="175" y="95" text-anchor="middle">Фінанси</text>

    <rect x="90" y="206" width="170" height="48" rx="3" fill="#ffffff" stroke="#9aa1b0" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="175" y="235" text-anchor="middle">Побут</text>

    <rect x="90" y="346" width="170" height="48" rx="3" fill="#ffffff" stroke="#9aa1b0" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="175" y="375" text-anchor="middle">Навчання</text>

    <rect x="380" y="66"  width="170" height="48" rx="3" fill="#ffffff" stroke="#a8622e" stroke-width="2"/>
    <text x="465" y="95" text-anchor="middle">Кар'єра</text>

    <rect x="380" y="206" width="170" height="48" rx="3" fill="#ffffff" stroke="#a8622e" stroke-width="2"/>
    <text x="465" y="235" text-anchor="middle">Стосунки</text>

    <rect x="380" y="346" width="170" height="48" rx="3" fill="#ffffff" stroke="#a8622e" stroke-width="2"/>
    <text x="465" y="375" text-anchor="middle">Спорт</text>
  </g>

  <rect x="270" y="188" width="100" height="84" rx="4" fill="#2e4f42"/>
  <text x="320" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#ffffff">Здоровʼя</text>
  <text x="320" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#ffffff" opacity="0.85">головна картка</text>
</svg>
