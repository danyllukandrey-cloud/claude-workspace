# Derived — never hand-edit without re-running /sdd:api life-area-card --reconcile after upstream changes.
#   fields + constraints  ← data-model.md (card, metric_block, entry, card_lifecycle_event)
#   error responses       ← sad.md §6 sequence alt-branches
#   endpoint list + shape ← spec.md §4 user stories / §5 acceptance criteria
openapi: 3.1.0

info:
  title: Life-area-card API
  version: 0.1.0
  description: |
    Картка — generic-механізм, що описує одну зону життя користувача (spec.md §2): назва, Опис
    (навіщо), блоки-метрики (кількість + частота + ціль у часі), Відстеження (порахований
    прогрес). Записи потрапляють у картку виключно через підтверджену пропозицію агента
    (`agent` API, поза цим контрактом) — цей API лише зберігає/читає картку й приймає вже
    підтверджені або неперевірені (pending, ADR-0002) записи.

    Прогрес рахується завжди з сирих подій, спільним кодом клієнт+бекенд (ADR-0001) — жодне поле
    тут не є похідним кешем, який можна розсинхронізувати.
  contact:
    name: Андрій Данилюк

servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost
    description: Local

security:
  - BearerAuth: []

tags:
  - name: Cards
    description: Створення, читання, редагування, архівація картки
  - name: MetricBlocks
    description: Блоки-метрики картки, включно з перенесенням із закритої картки Структури
  - name: Entries
    description: Записи подій (confirmed/pending/rejected) і їхня історія

paths:
  /api/v1/cards:
    get:
      tags: [Cards]
      summary: Прочитати колоду карток користувача (AC-04), або архів (AC-18)
      description: |
        За замовчуванням — лише активні картки (`status` = active). `status=archived` повертає
        архів (AC-18, US-16, 2026-08-29) — окремий список, той самий шлях, інший фільтр.
      operationId: listCards
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [active, archived], default: active }
        - in: query
          name: after
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardPage" }
        "401":
          $ref: "#/components/responses/Error"

    post:
      tags: [Cards]
      summary: Створити картку (AC-01 US-01)
      description: Лише назва обов'язкова — решта рішень (Опис, метрики) відкладені на US-02.
      operationId: createCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardCreate" }
            example:
              name: "Спорт"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/InvalidBodyTooLarge"
        "422":
          description: назва відсутня чи порожня (AC-02)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "card.name_required"
                message: "A name is required before a card can exist"

  /api/v1/cards/{cardId}:
    get:
      tags: [Cards]
      summary: Прочитати картку з пораховим агрегатом прогресу (AC-09/AC-09b/AC-10)
      description: |
        `aggregateProgress` — картковий агрегат (D-105: середнє часток виконання цілі серед
        bounded-блоків, capped 100% при перевищенні, AC-09b); `null` для декларативної картки без
        жодного bounded-блоку (AC-08). Виправлено 2026-09-06 (D-106) — попередній опис помилково
        обіцяв per-block `progress`/`overGoalAmount` полів, яких немає в схемі `Card`
        (`additionalProperties: false`); ці числа PWA рахує сама з `GET .../metric-blocks`
        (метадані) + `GET .../entries` (сирі події), не з цього ендпоінту. `dataWarning` —
        непорожнє, коли агент вважає щось на картці підозрілим (AC-10); не блокує решту картки.
      operationId: getCard
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/CardNotFound"

    patch:
      tags: [Cards]
      summary: Оновити назву/Опис, позначити заповненою (AC-02 US-02, AC-19 US-02)
      description: |
        Часткове оновлення. Позначення `status: filled` вимагає непорожнього `description`
        (AC-03) — сама назва вже перевірена при створенні. Той самий виклик покриває
        перейменування (AC-19, 2026-08-29) — окремого ендпоінта не потрібно, лише UI-вхід
        (SCR-02 стан `rename`).
      operationId: updateCard
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardUpdate" }
            example:
              description: "Регулярні тренування для форми й енергії"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/CardNotFound"
        "413":
          $ref: "#/components/responses/InvalidBodyTooLarge"
        "422":
          description: спроба позначити картку заповненою без Опису (AC-03)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "card.description_required"
                message: "A short \"навіщо\" is required before marking this card filled"

    delete:
      tags: [Cards]
      summary: Видалити (архівувати) картку (AC-16 US-14)
      description: |
        М'яка архівація — `status: archived`, ніколи фізичне видалення (той самий підхід, що
        `entry.status`). Картка зникає з колоди й з будь-якої розкладки Структури, лишається
        технічно відновлюваною.
      operationId: archiveCard
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/CardNotFound"

  /api/v1/cards/{cardId}/restore:
    post:
      tags: [Cards]
      summary: Розархівувати картку (AC-17 US-15)
      description: |
        `status: archived` → `active`. Позиція в розкладці Структури НЕ відновлюється
        автоматично (D-69) — користувач розкладає картку заново. Дзеркало `archiveCard`.
      operationId: restoreCard
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/CardNotFound"
        "409":
          description: картка вже активна (не в стані `archived`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "card.not_archived"
                message: "Only an archived card can be restored"

  /api/v1/cards/{cardId}/metric-blocks:
    get:
      tags: [MetricBlocks]
      summary: Прочитати список блоків-метрик картки (D-106, закриває ISS-39)
      description: |
        Метадані блоків картки (label/unit/targetCount/isOngoing/frequency), БЕЗ обчисленого
        прогресу — `progress`/`overGoalAmount` у відповіді відсутні (те саме, що `createMetricBlock`
        повертає при 201). Прогрес рахує PWA клієнтськи з сирих подій (docs/features/life-area-card/adr/0001-recompute-progress-from-raw-events.md,
        sad.md Critical flow 4/6) на основі цих метаданих + історії з `GET .../entries`. Без
        пагінації — жодне джерело (`spec.md`/`screens.md`) не фіксує ліміт блоків на картці,
        рішення спирається на припущення MVP-масштабу (одиниці блоків на картку), не на письмове
        обмеження; переглянути, якщо практика покаже інше.
      operationId: listMetricBlocks
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MetricBlock" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/CardNotFound"

    post:
      tags: [MetricBlocks]
      summary: Додати блок-метрику до картки (AC-05/AC-07/AC-08 US-02/06/08/09)
      description: |
        `targetCount`/`targetDate` опційні — `isOngoing: true` означає «постійний процес», без
        кінцевої дати (AC-05). Картка без жодного блоку лишається декларативною (AC-08) — це не
        помилка, просто відсутність цього виклику. Допомога перетворити розмиту ціль на вимірну
        (AC-07) відбувається в чаті з агентом до цього виклику, не тут.
      operationId: createMetricBlock
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetricBlockCreate" }
            example:
              label: "тренування"
              unit: "раз"
              targetCount: 12
              isOngoing: false
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricBlock" }
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/CardNotFound"
        "413":
          $ref: "#/components/responses/InvalidBodyTooLarge"
        "422":
          description: |
            `targetCount<=0` (review-фікс 2026-09-07 B6) — без цієї перевірки таке значення
            псує розрахунок прогресу на кожному наступному відкритті картки (domain/progress.ts),
            без шляху виправити через API
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "metric_block.invalid_target_count"
                message: "Ціль має бути додатним числом"

  /api/v1/cards/{cardId}/metric-blocks/transfer:
    post:
      tags: [MetricBlocks]
      summary: Прийняти блок-метрику, перенесену із закритої картки (AC-14/AC-15 US-13)
      description: |
        Викликається `structure` API під час закриття напрямку (`structure`'s
        `POST /structure/layout/{cardId}` `metricTransfers`), не напряму користувачем. Переносить
        блок-метрику й **усю** її історію записів у цю картку (AC-14). Якщо назва+одиниця
        збігаються з наявним блоком цієї картки — без `newLabel` повертає `409` замість мовчазного
        злиття (AC-15); повторний виклик з `newLabel` завершує перенесення.
      operationId: transferMetricBlock
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetricBlockTransferRequest" }
            example:
              sourceMetricBlockId: "8f14e45f-ceea-4d6a-9c3a-77b3f2a55e11"
              newLabel: null
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricBlock" }
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: цільова картка чи блок-метрика джерела не знайдені/не належать користувачу
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "card.not_found"
                message: "Card not found"
        "409":
          description: назва+одиниця вже є на цільовій картці — потрібен `newLabel` (AC-15)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "metric_block.name_collision"
                message: "This card already has a metric-block with that label and unit — provide newLabel to continue"
        "413":
          $ref: "#/components/responses/InvalidBodyTooLarge"

  /api/v1/cards/{cardId}/metric-blocks/{metricBlockId}:
    patch:
      tags: [MetricBlocks]
      summary: Виправити блок-метрику — перейменувати чи змінити налаштування (CH-03)
      description: |
        Часткове оновлення (лише передані поля змінюються): перейменування, зміна
        ціль/одиниця/частота/постійний процес/дата. Перенесення на іншу картку НЕ
        входить сюди — те робить окремий `POST .../metric-blocks/transfer` (наявний,
        AC-14/AC-15), нового бекенду для перенесення не додається (CH-03).
      operationId: updateMetricBlock
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: metricBlockId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetricBlockUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricBlock" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: |
            блок-метрика не знайдена, не належить користувачу, або `cardId` зі шляху не
            відповідає справжній картці блоку — той самий код, що DELETE нижче й
            `.../metric-blocks/transfer` (non-disclosure AC-04)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "card.not_found"
                message: "Card not found"
        "409":
          description: перейменування зіткнулось із наявним блоком тієї ж картки (та сама назва+одиниця)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "metric_block.name_collision"
                message: "У картці вже є блок із такою назвою й одиницею"
        "422":
          description: некоректна ціль (напр. <= 0)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "metric_block.invalid_target_count"
                message: "Ціль має бути додатним числом"
    delete:
      tags: [MetricBlocks]
      summary: Видалити (архівувати) окремий блок-метрику (AC-20 US-17)
      description: |
        М'яка архівація — `status: archived`, ніколи фізичне видалення (той самий підхід, що
        `archiveCard`/`entry.status`). Блок зникає зі звичайного списку блоків картки
        (`GET .../metric-blocks` більше його не повертає), лишається технічно читомим і
        відновлюваним напряму в базі, як і решта м'яких архівацій цього контракту.
      operationId: archiveMetricBlock
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: metricBlockId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricBlock" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: |
            блок-метрика не знайдена, не належить користувачу, або `cardId` зі шляху не
            відповідає справжній картці блоку — той самий код, що ISS-30 уже встановив для
            `.../metric-blocks/transfer` (non-disclosure AC-04, жодна з причин не розрізняється)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "card.not_found"
                message: "Card not found"

  /api/v1/cards/{cardId}/entries:
    get:
      tags: [Entries]
      summary: Прочитати історію останніх записів картки (AC-13 US-12)
      description: Найновіші зверху.
      operationId: listEntries
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: after
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryPage" }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/CardNotFound"

  /api/v1/cards/{cardId}/metric-blocks/{metricBlockId}/entries:
    post:
      tags: [Entries]
      summary: Записати подію (AC-01 happy; AC-06/AC-11 конфлікт → pending)
      description: |
        Викликається агентом після підтвердження (`agent` API `confirm`), не напряму користувачем.
        Звичайний запис повертає `status: confirmed`. Якщо виявлено близький за часом запис того
        самого блоку з іншого пристрою — обидва лишаються `status: pending`, не входять у прогрес,
        доки агент не уточнить дублікат/окремий запис (AC-06); те саме, якщо агент був тимчасово
        недоступний (AC-11) — запис лишається `pending` до першого повернення агента.
      operationId: createEntry
      parameters:
        - in: path
          name: cardId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: metricBlockId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryCreate" }
            example:
              amount: 5
              rawText: "пробіг 5 км"
              sourceDeviceId: "device-a1"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: картка чи блок-метрика не знайдені/не належать користувачу
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "metric_block.not_found"
                message: "Metric-block not found"
        "413":
          $ref: "#/components/responses/InvalidBodyTooLarge"

  /api/v1/entries/{entryId}:
    patch:
      tags: [Entries]
      summary: Виправити, відкотити чи вирішити конфлікт запису (AC-06/AC-11/AC-12 US-07/11/12)
      description: |
        Три випадки одного механізму: агент вирішує конфлікт близьких за часом записів
        (`status: confirmed` чи `rejected`, AC-06), агент підтверджує накопичений `pending` запис
        після повернення (AC-11), або користувач разом з агентом виправляє/відкочує помилковий
        запис з історії (AC-12 — `rejected`, ніколи фізичне видалення). Виклик іде через `agent`
        API, не напряму користувачем.
      operationId: resolveEntry
      parameters:
        - in: path
          name: entryId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryResolve" }
            example:
              status: "confirmed"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400":
          $ref: "#/components/responses/InvalidBody"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: запис не знайдений/не належить користувачу
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "entry.not_found"
                message: "Entry not found"
        "409":
          description: |
            запис уже в термінальному стані (review-фікс 2026-09-07, "подвійна резолюція не
            блокується") — єдиний задокументований легітимний перехід між двома термінальними
            станами лишається `confirmed` → `rejected` (AC-12, виправлення з історії); будь-що
            інше (той самий `status` вдруге, чи `rejected` → `confirmed`) тепер явний конфлікт,
            не тиха мутація
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "entry.already_resolved"
                message: "Запис уже вирішено"
        "413":
          $ref: "#/components/responses/InvalidBodyTooLarge"
        "422":
          description: |
            `status` поза `[confirmed, rejected]` (review-фікс 2026-09-07) — раніше будь-яке
            значення, що не є літерально `confirmed`, мовчки трактувалось як відхилення
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                code: "entry.invalid_status"
                message: "status має бути \"confirmed\" або \"rejected\""

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error — unified envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CardNotFound:
      description: |
        картка не знайдена серед карток поточного користувача — той самий код і для «не існує»,
        і для «належить іншому» (AC-04: не підтверджуємо й не спростовуємо)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: "card.not_found"
            message: "Card not found"
    InvalidBody:
      description: |
        Тіло запиту зіпсоване (некоректний JSON) — наскрізний body-parser middleware
        (`express.json()`, `plan/app/server/app.ts`), той самий код на кожному POST/PATCH цього
        контракту (post-ship review, "Express 5 req.body -> 500"), не прив'язаний до одного
        ендпоінту
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: "request.invalid_body"
            message: "Некоректне тіло запиту"
    InvalidBodyTooLarge:
      description: Тіло запиту завелике — той самий наскрізний body-parser middleware, що InvalidBody
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: "request.invalid_body"
            message: "Некоректне тіло запиту"

  schemas:
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: "^[a-z_]+\\.[a-z_]+$"
          example: "card.not_found"
        message: { type: string }
        details:
          type: object
          description: опційний структурований контекст

    Card:
      type: object
      required: [id, name, status, trackingMode, healthState, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        status:
          type: string
          enum: [active, archived]
          description: "archived — м'яка архівація (AC-16), ніколи фізичне видалення"
        trackingMode:
          type: string
          enum: [state, ongoing, goals]
          description: "CH-02/CH-10 — 'state' = «картка: стан без вимірювань» (кольоровий м'ячик замість блоків-метрик); 'ongoing' = «постійний процес» (блоки без цілі/дати); 'goals' = «з цілями та метриками» (блоки з ціллю+датою, колишній 'metrics')"
        healthState:
          type: [string, "null"]
          enum: [active, critical, paused, null]
          description: "CH-02 — ненульове лише коли trackingMode='state': активна (зелений) / критично потребує відновлення (червоний) / на паузі (жовтий)"
        aggregateProgress:
          type: [number, "null"]
          description: середнє часток виконання цілі по всіх блоках-метриках картки; NULL для декларативної картки без жодного блоку (AC-08)
        dataWarning:
          type: [string, "null"]
          description: пояснення агента, що саме виглядає некоректно (AC-10); NULL, коли нічого не виявлено
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CardCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string }

    CardUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: [string, "null"] }
        markFilled:
          type: boolean
          description: "true = спроба перейти в стан «заповнена» (AC-03 перевіряє Опис)"
        trackingMode:
          type: string
          enum: [state, ongoing, goals]
          description: "CH-02/CH-10 — 'state' вимагає healthState у ТОМУ Ж тілі; 'ongoing'/'goals' завжди скидають healthState на null"
        healthState:
          type: [string, "null"]
          enum: [active, critical, paused, null]
          description: "CH-02 — обов'язкове, лише коли trackingMode='state' у цьому ж тілі"

    MetricBlock:
      type: object
      required: [id, cardId, label, unit, isOngoing, createdAt, updatedAt, status]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        label: { type: string }
        unit: { type: string }
        frequency: { type: [string, "null"] }
        targetCount: { type: [number, "null"] }
        isOngoing:
          type: boolean
          description: "«постійний процес» (AC-05) — прогрес показується як накопичена кількість, не відсоток"
        targetDate: { type: [string, "null"], format: date }
        progress:
          type: [number, "null"]
          description: частка виконання цілі, обмежена 1.0 (AC-09b); NULL для is_ongoing без денумератора
        overGoalAmount:
          type: [number, "null"]
          description: сума понад ціль, показана окремо при перевищенні (AC-09b)
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        status:
          type: string
          enum: [active, archived]
          description: "D-127 — archived: мʼяка архівація окремого блоку-метрики (US-17/AC-20), ніколи фізичне видалення; той самий підхід, що Card.status"

    MetricBlockCreate:
      type: object
      required: [label, unit]
      additionalProperties: false
      properties:
        label: { type: string }
        unit: { type: string }
        frequency: { type: [string, "null"] }
        targetCount: { type: [number, "null"] }
        isOngoing: { type: boolean, default: false }
        targetDate: { type: [string, "null"], format: date }

    MetricBlockUpdate:
      type: object
      additionalProperties: false
      description: "CH-03 (docs/features/life-area-card/changes.md) — часткове оновлення (перейменування/налаштування), БЕЗ перенесення на іншу картку (те робить MetricBlockTransferRequest)"
      properties:
        label: { type: string }
        unit: { type: string }
        frequency: { type: [string, "null"] }
        targetCount: { type: [number, "null"] }
        isOngoing: { type: boolean }
        targetDate: { type: [string, "null"], format: date }

    MetricBlockTransferRequest:
      type: object
      required: [sourceMetricBlockId]
      additionalProperties: false
      properties:
        sourceMetricBlockId:
          type: string
          format: uuid
          description: блок-метрика на картці, що закривається (structure AC-12)
        newLabel:
          type: [string, "null"]
          description: "перейменування при колізії назви+одиниці (AC-15); NULL, доки колізія не виявлена"

    Entry:
      type: object
      required: [id, metricBlockId, cardId, amount, status, recordedAt, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        metricBlockId: { type: string, format: uuid }
        cardId: { type: string, format: uuid }
        amount: { type: number }
        rawText: { type: [string, "null"] }
        status:
          type: string
          enum: [pending, confirmed, rejected]
          description: "ADR-0002 — pending не входить у прогрес до підтвердження"
        sourceDeviceId: { type: [string, "null"] }
        recordedAt: { type: string, format: date-time }
        confirmedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    EntryCreate:
      type: object
      required: [amount]
      additionalProperties: false
      properties:
        amount: { type: number }
        rawText: { type: [string, "null"] }
        sourceDeviceId: { type: [string, "null"] }

    EntryResolve:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [confirmed, rejected]

    CardPage:
      type: object
      required: [items, has_next, has_prev]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Card" }
        has_next: { type: boolean }
        has_prev: { type: boolean }
        next_cursor: { type: [string, "null"], format: uuid }

    EntryPage:
      type: object
      required: [items, has_next, has_prev]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
        has_next: { type: boolean }
        has_prev: { type: boolean }
        next_cursor: { type: [string, "null"], format: uuid }
